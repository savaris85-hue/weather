async function requestPws(path,params={},ttl=0,opts={}){

 let url;try{if(store.settings.proxy.trim()){const base=new URL(store.settings.proxy.trim());if(!/^https?:$/.test(base.protocol))throw Error('Unsupported proxy URL');base.searchParams.set('path',path);for(const [k,v] of query)base.searchParams.set(k,v);url=base.toString();}else url=`https://api.weather.com${path}?${query}`;}catch{throw apiError(0,'Invalid Proxy URL in Settings.');}

 if(!opts.force){const mem=rt.memory.get(cacheKey);if(mem&&Date.now()-mem.at<ttl)return mem.value;const disk=await dbGet(cacheKey);if(disk&&Date.now()-disk.at<ttl){rt.memory.set(cacheKey,disk);return disk.value;}}

}

// Discover public community stations from the visible viewport.
// Official openSenseMap backend validation enforces limit<=20 (not 100/300).
// Tile the viewport, cache each tile, and subdivide tiles that hit that limit.
// No fabricated stations, no unauthorized third-party PWS access.
function normalizeBoxCollection(payload){
 const list=Array.isArray(payload)?payload:Array.isArray(payload?.boxes)?payload.boxes:
  Array.isArray(payload?.features)?payload.features:[];
 return list.map(item=>item?.type==='Feature'||item?.geometry&&item?.properties?
  {...(item.properties||{}),_id:item.properties?._id||item.properties?.id||item.id,
   currentLocation:{coordinates:item.geometry?.coordinates},sensors:item.properties?.sensors||[]} : item);
}
function boundsParts(bounds,cols,rows){
 const sw=bounds.getSouthWest(),ne=bounds.getNorthEast(),parts=[];
 const south=Math.max(-89.999,sw.lat),north=Math.min(89.999,ne.lat);
 const west=Math.max(-179.999,sw.lng),east=Math.min(179.999,ne.lng);
 if(east<=west||north<=south)return parts;
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
  const dx=(east-west)/cols,dy=(north-south)/rows;
  parts.push([west+dx*x,south+dy*y,west+dx*(x+1),south+dy*(y+1)]);
 }
 return parts;
}
async function querySenseTile(coords){
 const params=new URLSearchParams({bbox:coords.map(n=>n.toFixed(6)).join(','),limit:'20',format:'json'});
 // The backend accepts a maximum of 20. This precise limit is mandatory.
 const payload=await getJson(`${SENSE_API}/boxes?${params}`,5*60000);

}
async function searchSenseRegion(bounds,centerLat,centerLon,onProgress=null,scanActive=()=>true){
 const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
 // Dense zoom levels need more cells; keep a hard per-scan request cap.
 const width=kmBetween(centerLat,sw.lng,centerLat,ne.lng);
 const height=kmBetween(sw.lat,centerLon,ne.lat,centerLon);
 const cols=width>150?2:width>30?3:4,rows=height>150?2:height>30?3:4;
 const queue=boundsParts(bounds,cols,rows),unique=new Map();let requests=0,firstError=null,successes=0;
 while(queue.length&&requests<36&&scanActive()){
  const tile=queue.shift();requests++;
  try{
   const records=await querySenseTile(tile);successes++;
   for(const box of records){const station=makeNearby(box,centerLat,centerLon);
    if(station&&station.hasWeather)unique.set(station.id,station);}
   if(typeof onProgress==='function')onProgress([...unique.values()].sort((a,b)=>a.distance-b.distance),requests,queue.length);
   // Query saturated cells again as four smaller tiles, within the request cap.
   if(records.length===20&&requests+queue.length+4<=36){
    const [w,s,e,n]=tile,mx=(w+e)/2,my=(s+n)/2;
    queue.push([w,s,mx,my],[mx,s,e,my],[w,my,mx,n],[mx,my,e,n]);
   }
  }catch(error){firstError??=error;
   // A failing cell should not erase valid markers from other cells.
   if(error.status===429)break;
  }
 }
 if(!successes&&firstError)throw firstError;

}
function circularBounds(lat,lon,radiusKm){

 const south=Math.max(-89.999,lat-dy),north=Math.min(89.999,lat+dy);

 for(const radius of [12,45,140]){
  try{const items=await searchSenseRegion(circularBounds(lat,lon,radius),lat,lon);
   if(items.length){rt.nearby=items;rt.mapCenter={lat,lon};return items;}
  }catch(e){lastError=e;if(e.status===429)break;}

// These key-free raster alternatives have their own attribution/usage terms.
const TILES={
 light:['https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png','© OpenStreetMap contributors · © OpenStreetMap France'],
 dark:['https://tile.openmaps.fr/opentopomap/{z}/{x}/{y}.png','© OpenStreetMap contributors · © OpenTopoMap-R · openmaps.fr'],
 satellite:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Tiles © Esri and imagery contributors']
};
const FALLBACK_TILES=[
 ['https://tile.openmaps.fr/opentopomap/{z}/{x}/{y}.png','© OpenStreetMap contributors · © OpenTopoMap-R · openmaps.fr'],
 ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}','Tiles © Esri and data contributors']
];
function officialMapHref(lat,lon,zoom=14){const u=new URL('https://www.wunderground.com/wundermap');
 u.searchParams.set('weather-stations','temperature-wind');u.searchParams.set('lat',Number(lat).toFixed(3));
 u.searchParams.set('lon',Number(lon).toFixed(3));u.searchParams.set('zoom',String(Math.max(5,Math.min(18,zoom))));
 return u.toString();}

 openModal(`<div class="dialog-head"><div><h2>${t('chooseOnMap')}</h2><small>${t('autoMapHint')}</small></div><button class="icon-btn" data-action="close-modal" aria-label="${t('close')}">×</button></div>
 <div class="dialog-body"><form id="placeForm" class="map-search"><input class="control" name="place" aria-label="${t('searchCity')}" placeholder="${t('optionalPlace')} / 37.98, 23.73"><button class="button primary" type="submit">⌕ ${t('search')}</button><button class="button" type="button" data-action="locate-map">◎ GPS</button></form>
 <div id="mapCanvas" aria-label="${t('chooseOnMap')}" role="application" style="height:min(61dvh,660px);min-height:270px;border-radius:14px;margin-top:10px"></div>
 <div class="map-provider-note">● ${t('mapSourceNote')} <a id="officialPwsMap" class="official-pws-link" href="${officialMapHref(lat0,lon0,14)}" target="_blank" rel="noopener noreferrer">${t('officialStationMap')} ↗</a></div>
 <p id="mapStatus" class="help" role="status" aria-live="polite">${t('loadingMap')}</p>
 <div id="mapResults" class="nearby-list" aria-label="${t('nearStations')}"></div></div>`,true);
 rt.mapCenter={lat:lat0,lon:lon0};setTimeout(()=>initMap(lat0,lon0),90);
}
function attachTiles(map,source,index=0){
 const choice=source||TILES.light,layer=L.tileLayer(choice[0],{maxZoom:19,attribution:choice[1],keepBuffer:1});
 let errors=0;
 layer.on('tileerror',()=>{
  if(++errors>=3&&rt.map===map){
   const next=FALLBACK_TILES[index];if(!next||next[0]===choice[0])return;
   map.removeLayer(layer);attachTiles(map,next,index+1);
   const label=$('#mapStatus');if(label)label.textContent=t('alternativeTiles');
  }
 });layer.addTo(map);return layer;
}
function initMap(lat,lon){
 const node=$('#mapCanvas');if(!node)return;
 if(!window.L){
  node.innerHTML=`<p class="notice">${t('mapUnavailable')}</p><input class="control" id="fallbackcoords" value="${lat}, ${lon}" aria-label="Latitude longitude"><button class="button primary" data-action="use-coordinates">${t('nearest')}</button>`;
  void findAt(lat,lon,false);return;
 }
 const map=L.map('mapCanvas',{zoomControl:true,scrollWheelZoom:true,preferCanvas:true,zoomSnap:1}).setView([lat,lon],9);
 rt.map=map;rt.mapPins=[];rt.markerCanvas=null;node.classList.toggle('map-dark',store.settings.mapStyle==='dark');
 attachTiles(map,TILES[store.settings.mapStyle]||TILES.light);
 rt.locationMarker=L.circleMarker([lat,lon],{radius:8,color:'#137b72',weight:2,fillOpacity:.15}).addTo(map);
 map.on('click',event=>{void findAt(event.latlng.lat,event.latlng.lng,true);});
 map.on('moveend',()=>{const c=map.getCenter(),link=$('#officialPwsMap');if(link)link.href=officialMapHref(c.lat,c.lng,map.getZoom());scheduleVisibleStations(map);});
 map.on('zoomend',()=>{if(rt.nearby?.length)renderPins(rt.nearby);});
 setTimeout(()=>{if(rt.map===map){map.invalidateSize();void loadVisibleStations(map);}},220);
}
let locateSeq=0,mapScanSeq=0,mapScanTimer=null;
function scheduleVisibleStations(map){
 clearTimeout(mapScanTimer);
 mapScanTimer=setTimeout(()=>{if(rt.map===map)void loadVisibleStations(map);},430);
}
async function loadVisibleStations(map){
 if(rt.map!==map)return;
 const seq=++mapScanSeq,zoom=map.getZoom(),status=$('#mapStatus'),list=$('#mapResults');
 if(zoom<5){if(status)status.textContent=t('zoomForStations');if(list)list.innerHTML='';renderPins([]);return;}
 const center=map.getCenter();if(status)status.textContent=t('loadingMap');
 if(list&&!rt.nearby.length)list.innerHTML='<div class="skeleton"></div>';
 try{
  const live=()=>rt.map===map&&mapScanSeq===seq;
  const progress=(partial,count,remaining)=>{if(!live())return;
   rt.nearby=partial;renderPins(partial);renderNearbyList(partial);
   if(status)status.textContent=`${partial.length} ${t('visibleStations')} · ${t('loadingMap')} (${count})`;
  };
  const values=await searchSenseRegion(map.getBounds(),center.lat,center.lng,progress,live);
  if(!live())return;
  rt.nearby=values;rt.mapCenter={lat:center.lat,lon:center.lng};
  renderPins(values);renderNearbyList(values);
  if(status)status.textContent=values.length?
   `${values.length} ${t('visibleStations')} · ${t('tapPin')}`:t('noVisibleStations');
 }catch(e){
  if(rt.map!==map||mapScanSeq!==seq)return;
  if(status)status.textContent=`${t('stationLoadError')}: ${e.status||e.message}. ${t('retryOnMove')} · ${t('officialMapTip')}`;
  if(list)list.innerHTML=`<p class="notice error">${safe(e.message,200)}</p>`;
 }
}
function renderNearbyList(items){
 const list=$('#mapResults');if(!list)return;
 list.innerHTML=items.slice(0,36).map(item=>`<button class="nearby-item" data-action="near-pick" data-id="${safe(item.id)}"><span><b>${safe(item.name)}</b><br><small>${safe(item.id,40)} · ${item.hasTemp?'🌡️ ':''}${item.lastSeen?when(item.lastSeen):t('unknown')}</small></span><small>${fmtDistance(item.distance)} ＋</small></button>`).join('')||`<p class="help">${t('noVisibleStations')}</p>`;
}
async function findAt(lat,lon,autoAdd){
 if(!finite(lat)||!finite(lon))return;
 // A direct click takes priority over a slow viewport scan; stop enqueuing tile requests.
 if(autoAdd){mapScanSeq++;clearTimeout(mapScanTimer);}
 const seq=++locateSeq,status=$('#mapStatus');rt.mapCenter={lat,lon};
 if(status)status.textContent=t('findingNearest');
 if(rt.locationMarker)rt.locationMarker.setLatLng([lat,lon]);
 try{
  // Reuse visible station markers, fetching a new neighbourhood only if needed.
  let stations=(rt.nearby||[]).map(x=>({...x,distance:kmBetween(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.distance-b.distance);
  if(!stations.length||stations[0].distance>40)stations=await searchSenseNear(lat,lon);
  if(seq!==locateSeq)return;
  const best=await nearestFromList(stations);
  if(seq!==locateSeq)return;
  if(status)status.textContent=best?
   `${t('nearest')}: ${best.name} · ${fmtDistance(best.distance)}${!best.lastSeen||Date.now()-best.lastSeen>3600000?' · '+t('offline'):''}`:t('noVisibleStations');
  if(autoAdd&&best){closeModal();addStation(best);return;}
  renderNearbyList(stations);if(rt.map)renderPins(stations);
  if(autoAdd&&!best)toast(t('noVisibleStations'));
 }catch(e){if(seq!==locateSeq)return;if(status)status.textContent=`${t('stationLoadError')}: ${e.status||e.message}`;}
}
async function nearestFromList(stations){
 if(!stations?.length)return null;
 const sorted=[...stations].sort((a,b)=>a.distance-b.distance);
 const candidates=sorted.filter(s=>s.hasWeather).slice(0,8);
 for(const candidate of candidates){
  try{
   const box=await getJson(`${SENSE_API}/boxes/${candidate.id.slice(3)}`,180000,'sense:'+candidate.id);
   const record=senseRecord(box);
   candidate.hasTemp=finite(record.temp);
   candidate.hasWeather=['temp','humidity','pressure','wind','rain'].some(k=>finite(record[k]));
   candidate.lastSeen=record.t;
   if(candidate.hasWeather&&record.t&&Date.now()-record.t<3*3600000)return candidate;
  }catch{}
 }
 // If the nearest stations stopped reporting, open the nearest one with an OFFLINE
 // indication rather than making a map tap appear unresponsive. Never invent a reading.
 return sorted.find(s=>s.hasWeather&&s.lastSeen&&Date.now()-s.lastSeen<3*3600000)||
  sorted.find(s=>s.hasWeather)||null;
}
function fmtDistance(km){return !finite(km)?'—':km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km';}
function renderPins(items){
 const map=rt.map;if(!map||!window.L)return;
 if(rt.mapPins){rt.mapPins.forEach(m=>map.removeLayer(m));rt.mapPins=[];}
 // Native Leaflet canvas-backed points: no extra CDN and touch-friendly.
 const renderer=rt.markerCanvas||(rt.markerCanvas=L.canvas({padding:.15}));
 const zoom=map.getZoom();let visible=items.slice(0,300);
 if(zoom<8&&visible.length>140){
  // Compact distant markers in the map pixel grid; zooming reveals individuals.
  const cells=new Map();for(const item of visible){const p=map.project([item.lat,item.lon],zoom),key=`${Math.floor(p.x/38)}:${Math.floor(p.y/38)}`;
   const g=cells.get(key)||[];g.push(item);cells.set(key,g);}
  rt.mapPins=[...cells.values()].map(group=>{
   const center=group[0],pin=L.circleMarker([center.lat,center.lon],{
    radius:group.length>1?Math.min(18,7+Math.log2(group.length)*3):7,color:'#ffffff',weight:2,
    fillColor:'#168874',fillOpacity:.92,renderer}).addTo(map);
   if(group.length>1){pin.bindTooltip(`${group.length} ${t('visibleStations')}`);pin.on('click',ev=>{L.DomEvent.stopPropagation(ev);map.setView([center.lat,center.lon],Math.min(12,zoom+2));});}
   else{pin.bindTooltip(safe(center.name));pin.on('click',ev=>{L.DomEvent.stopPropagation(ev);closeModal();addStation(center);});}
   return pin;});
 }else{
  rt.mapPins=visible.map(item=>{
   const live=item.lastSeen&&Date.now()-item.lastSeen<3*3600000;
   const pin=finite(item.temp)&&typeof L.divIcon==='function'&&typeof L.marker==='function'?
    L.marker([item.lat,item.lon],{icon:L.divIcon({className:'station-temp-marker',html:`<span class="station-temp-value ${live?'is-live':'is-stale'}">${fmt('temp',item.temp,0)}°</span>`,iconSize:[45,30],iconAnchor:[22,15]})}).addTo(map):
    L.circleMarker([item.lat,item.lon],{radius:8,color:'#fff',weight:2,fillColor:live?'#0e937b':'#899aa5',fillOpacity:.94,renderer}).addTo(map);
   pin.bindTooltip(`${safe(item.name)} · ${item.hasTemp?'🌡️ ':''}${item.lastSeen?when(item.lastSeen):t('unknown')}`);
   pin.on('click',event=>{L.DomEvent.stopPropagation(event);closeModal();addStation(item);});
   return pin;
  });
 }
}
async function findUserLocation(openMap=true){
 if(!navigator.geolocation){toast(t('gpsOnly'));return;}
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  if(openMap)mapDialog(lat,lon);else if(rt.map){rt.map.setView([lat,lon],11);void findAt(lat,lon,true);}
 },()=>toast(t('gpsOnly')),{enableHighAccuracy:false,timeout:13000,maximumAge:300000});
}

function renderSheet(){const h=rt.sheet,st=active();if(!h||!st)return;const name=t(WIDGETS[h.widget]?.[0]||h.widget);$('#sheet').innerHTML=`<div class="sheet-head"><h2>${name} · <span class="muted">${safe(st.alias||st.name)}</span></h2><div class="sheet-actions"><button class="icon-btn" data-action="close-sheet" aria-label="${t('close')}">×</button></div></div><div class="sheet-body"><div class="segmented"><button class="seg-btn ${h.mode==='info'?'active':''}" data-action="sheet-mode" data-value="info">☷ ${t('infographic')}</button><button class="seg-btn ${h.mode==='graph'?'active':''}" data-action="sheet-mode" data-value="graph">▥ ${t('graph')}</button></div>${h.mode==='info'?`<div class="detail-visual"><div class="detail-preview" data-widget="${h.widget}">${tileContent(st,h.widget,true)}</div>${h.widget==='history'?`<div class="history-toolbar"><button class="button" data-action="history-shift" data-value="-1">‹</button>${['day','week','month','year'].map(k=>`<button class="button ${h.range===k?'primary':''}" data-action="history-period" data-value="${k}">${t(k)}</button>`).join('')}<button class="button" data-action="history-shift" data-value="1">›</button></div><div id="historyData" class="detail-grid" aria-live="polite"></div>`:`<div class="detail-grid">${detailCells(st,h.widget)}</div>`}</div>`:graphToolbar()}</div>`;if(h.mode==='graph')void updateGraph();else if(h.widget==='history')void updateHistoricalExtremes();}
function detailCells(st,w){const r=rt.current.get(st.id)||{},astro=astronomy(st.lat,st.lon),kv={temp:[['temp','temperature'],['feel','feels'],['dew','dew'],['humidity','humidity']],wind:[['wind','wind'],['gust','gust'],['pressure','pressure']],humidity:[['humidity','humidity'],['temp','temperature'],['dew','dew']],pressure:[['pressure','pressure']],rain:[['rain','rainToday'],['rainRate','rainTile']],station:[['elev','elevation']],sky:[],history:[['temp','temperature'],['humidity','humidity'],['pressure','pressure'],['rain','rainTile']],forecastDays:[],forecastHours:[]};let rows=(kv[w]||[[w,WIDGETS[w]?.[0]||w]]).map(([k,label])=>`<div class="detail-cell"><small>${t(label)}</small><strong>${fmt(k,r[k])} <small>${unitFor(k)}</small></strong></div>`);if(w==='sky'&&astro){rows=[['sunrise',clock(astro.sunrise)],['sunset',clock(astro.sunset)],['dayLength',duration(astro.day)],['nightLength',duration(astro.night)],['moon',moonIcon(astro.phase)]].map(([k,v])=>`<div class="detail-cell"><small>${t(k)}</small><strong>${v}</strong></div>`);}if(w==='station')rows.push(`<div class="detail-cell"><small>${t('id')}</small><strong style="font-size:1rem">${safe(st.id)}</strong></div><div class="detail-cell"><small>${t('coordinates')}</small><strong style="font-size:1rem">${st.lat??'—'}, ${st.lon??'—'}</strong></div><div class="detail-cell"><small>${t('source')}</small><strong>${providerText(st)}</strong></div><div class="detail-cell"><small>${t('lastUpdate')}</small><strong>${currentTime(st)}</strong></div>`);return rows.join('');}
async function updateHistoricalExtremes(){const h=rt.sheet,st=active(),el=$('#historyData');if(!h||h.widget!=='history'||!el)return;const days={day:1,week:7,month:30,year:365}[h.range]||7, end=Date.now()+h.historyOffset*days*86400000,start=end-days*86400000;el.innerHTML=`<div class="skeleton big"></div>`;try{const keys=['temp','humidity','pressure','rain','rainRate','dew'];let rows=await getRangeRows(st,start,end,keys);if(h!==rt.sheet)return;el.innerHTML=keys.map(k=>{const v=rows.map(x=>x[k]).filter(finite);return `<div class="detail-cell"><small>${t(SERIES[k]?.[0]||k)}</small><strong>${v.length?fmt(k,Math.max(...v)):'—'} ${unitFor(k)}</strong><div class="measure-sub">${t('minimum')}: ${v.length?fmt(k,Math.min(...v)):'—'} · ${t('average')}: ${fmt(k,mean(v))}</div></div>`;}).join('')+`<div class="detail-cell"><small>${t('from')} - ${t('to')}</small><strong style="font-size:.9rem">${when(start)} - ${when(end)}</strong></div>`;}catch(e){if(el)el.textContent=e.message;}}
function periodBounds(h){const now=Date.now(),days={day:1,week:7,month:30,year:365};let end=now,start=now-days[h.range]*86400000;if(h.widget==='forecastHours'||h.widget==='forecastDays'){start=now;end=now+Math.min(10,days[h.range]||10)*86400000;}if(h.range==='custom'){start=Date.parse(h.from+'T00:00:00');end=Math.min(now,Date.parse(h.to+'T23:59:59'));}return {start,end};}
async function getRangeRows(st,start,end,keys){if(st&&rt.forecast.has(st.id)&&rt.sheet&&['forecastHours','forecastDays'].includes(rt.sheet.widget)){const f=rt.forecast.get(st.id)?.hourly;if(!Array.isArray(f?.time))return [];return f.time.map((v,i)=>({t:Date.parse(v),temp:f.temperature_2m?.[i],feel:f.apparent_temperature?.[i],dew:f.dew_point_2m?.[i],humidity:f.relative_humidity_2m?.[i],pressure:f.pressure_msl?.[i],wind:f.wind_speed_10m?.[i],winddir:f.wind_direction_10m?.[i],rain:f.precipitation?.[i]??null})).filter(p=>finite(p.t)&&p.t>=start&&p.t<=end);}if(isDemo(st))return [...generateDemo().rapid,...generateDemo().hourly].filter(x=>x.t>=start&&x.t<=end);const n=end-start;if(n<=86400000*1.1){const fast=rt.rapid.get(st.id)||[];if(fast.length&&fast[0].t<=start+3*3600000)return fast.filter(x=>x.t>=start&&x.t<=end);}if(n<=7.1*86400000){const fast=rt.hourly.get(st.id)||[];if(fast.length&&fast[0].t<=start+4*3600000)return fast.filter(x=>x.t>=start&&x.t<=end);}return loadHistory(st,start,end,keys);}

async function updateGraph(){const h=rt.sheet,st=active();if(!h||h.mode!=='graph'||!st)return;const serial=++graphCounter;rt.abortHistory?.abort();rt.abortHistory=new AbortController();const s=$('#chartState');if(s){s.hidden=false;s.textContent=t('fetching')+'…';}const canvas=$('#graphCanvas');if(!canvas)return;if(rt.chart){rt.chart.destroy();rt.chart=null;}const {start,end}=periodBounds(h);if(!finite(start)||!finite(end)||start>=end){if(s)s.textContent=t('dateError');return;}h.zoomStart=null;h.zoomEnd=null;

 }catch(e){if(serial!==graphCounter)return;if(s)s.textContent=e.message;} }
function showChart(primary,extra,shift,label,start,end){const h=rt.sheet,s=$('#chartState'),canvas=$('#graphCanvas');if(!canvas||!h)return;const keys=h.selected.length?h.selected:possibleKeys(h.widget).slice(0,1);const data=uniqPoints(primary);rt.visibleData=data;if(!data.some(p=>keys.some(k=>finite(p[k])))){if(s)s.textContent=t('notEnough');return;}if(s)s.hidden=true;if(!window.Chart){if(s){s.hidden=false;s.textContent=t('chartUnavailable');}updateStats(data,keys,start,end);return;}
 const groups=[...new Set(keys.map(metricGroup))],datasets=[];for(const k of keys){const points=data.filter(p=>finite(p[k])).map(p=>({x:p.t,y:converted(k,p[k])}));if(!points.length)continue;datasets.push({label:`${t(SERIES[k]?.[0]||k)} (${unitFor(k)})`,data:points,borderColor:SERIES[k]?.[1]||'#6c8eb7',backgroundColor:SERIES[k]?.[1]||'#6c8eb7',yAxisID:'y_'+metricGroup(k),pointRadius:0,pointHoverRadius:4,borderWidth:2,tension:.2,spanGaps:true});const comparison=extra.filter(p=>finite(p[k])).map(p=>({x:p.t+shift,y:converted(k,p[k])}));if(comparison.length)datasets.push({label:`${label} · ${t(SERIES[k]?.[0]||k)}`,data:comparison,borderColor:SERIES[k]?.[1]||'#6c8eb7',borderDash:[6,5],yAxisID:'y_'+metricGroup(k),pointRadius:0,borderWidth:1.5,tension:.12});}
 const axes={x:{type:'linear',min:start,max:end,ticks:{color:'#82949c',maxTicksLimit:8,callback:v=>new Date(v).toLocaleDateString(store.settings.lang==='el'?'el-GR':'en-GB',{month:'short',day:'numeric',hour:end-start<=86400000*2?'2-digit':undefined})},grid:{color:'rgba(115,143,145,.13)'}}};groups.forEach((g,i)=>axes['y_'+g]={type:'linear',position:i%2?'right':'left',display:i<4,grid:{drawOnChartArea:i===0,color:'rgba(115,143,145,.13)'},ticks:{color:'#82949c',maxTicksLimit:7},title:{display:true,text:unitFor(keys.find(k=>metricGroup(k)===g)),color:'#87979a'}});
 rt.chart=new Chart(canvas,{type:'line',data:{datasets},options:{parsing:false,normalized:true,responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:17,usePointStyle:true,color:'#8498a2'}},tooltip:{enabled:true,callbacks:{title:items=>items.length?when(items[0].parsed.x):''}}},scales:axes},plugins:[chartCrosshair]});attachChartPan(canvas,start,end);updateStats(data,keys,start,end);$('#textChartAlt').textContent=keys.map(k=>`${t(SERIES[k]?.[0]||k)}: ${data.filter(x=>finite(x[k])).length} readings`).join('. ');}
function updateStats(data,keys,from,to){const inRange=data.filter(p=>p.t>=from&&p.t<=to),markup=keys.map(k=>{const v=inRange.filter(x=>finite(x[k])).map(x=>x[k]);if(!v.length)return '';return `<div class="detail-cell"><small>${t(SERIES[k]?.[0]||k)}</small><strong>${fmt(k,mean(v))} ${unitFor(k)}</strong><div class="measure-sub">${t('minimum')}: ${fmt(k,Math.min(...v))} · ${t('maximum')}: ${fmt(k,Math.max(...v))}</div></div>`;}).join('');if($('#rangeStats'))$('#rangeStats').innerHTML=markup||`<p>${t('notEnough')}</p>`;}
function attachChartPan(canvas,baseStart,baseEnd){let drag=null;canvas.onwheel=e=>{if(!rt.chart)return;e.preventDefault();const h=rt.sheet,scale=rt.chart.scales.x,factor=e.deltaY>0?1.3:.77,mid=scale.getValueForPixel(e.offsetX),start=scale.min,end=scale.max,newA=Math.max(baseStart,mid-(mid-start)*factor),newB=Math.min(baseEnd,mid+(end-mid)*factor);if(newB-newA<600000)return;scale.options.min=newA;scale.options.max=newB;rt.chart.update('none');updateStats(rt.visibleData,h.selected,newA,newB);};canvas.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(!rt.chart)return;drag={x:e.clientX,min:rt.chart.scales.x.min,max:rt.chart.scales.x.max,at:Date.now(),touch:e.pointerType!=='mouse'};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!rt.chart)return;rt.chart._crossIndex=e.offsetX;if(!drag){rt.chart.draw();return;}const axis=rt.chart.scales.x,px=e.clientX-drag.x,span=drag.max-drag.min,delta=-px/(axis.right-axis.left)*span;let a=drag.min+delta,b=drag.max+delta;if(a<baseStart){b+=baseStart-a;a=baseStart;}if(b>baseEnd){a-=b-baseEnd;b=baseEnd;}if(a<baseStart)a=baseStart;axis.options.min=a;axis.options.max=b;rt.chart.update('none');};canvas.onpointerup=e=>{if(!drag||!rt.chart)return;const axis=rt.chart.scales.x;updateStats(rt.visibleData,rt.sheet.selected,axis.min,axis.max);drag=null;};canvas.onpointercancel=()=>drag=null;}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(rt.sheet)closeSheet();else if($('#modal').open)closeModal();return;}const tag=e.target.tagName;if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open-widget]')){e.preventDefault();openSheet(e.target.dataset.openWidget);}if(['INPUT','TEXTAREA','SELECT'].includes(tag)||$('#sheet').open||$('#modal').open)return;if(e.key==='ArrowLeft')switchStation(-1);else if(e.key==='ArrowRight')switchStation(1);});
document.addEventListener('change',async e=>{const n=e.target;if(n.dataset.setting){store.settings[n.dataset.setting]=n.dataset.setting==='refresh'||n.dataset.setting==='waterYear'?Number(n.value):n.value;persist();render();if(['apiKey','proxy'].includes(n.dataset.setting)&&active()?.source==='wu')void activateData(active(),true);return;}if(n.dataset.series&&rt.sheet){const k=n.dataset.series;rt.sheet.selected=n.checked?[...new Set([...rt.sheet.selected,k])]:rt.sheet.selected.filter(x=>x!==k);void updateGraph();}if(n.id==='compareSelect'&&rt.sheet){rt.sheet.compare=n.value;void updateGraph();}if(n.id==='file-import'&&n.files?.[0]){try{const x=JSON.parse(await n.files[0].text());if(!Array.isArray(x.stations)||!x.settings||typeof x.settings!=='object')throw Error('Invalid backup');store={settings:{...DEFAULT_SETTINGS,...x.settings,apiKey:store.settings.apiKey},stations:x.stations.filter(s=>s&&typeof s.id==='string'&&Array.isArray(s.layout)).slice(0,100).map(s=>({...s,layout:s.layout.filter(k=>WIDGETS[k])})),active:x.active};if(!store.stations.some(s=>s.id===store.active))store.active=store.stations[0]?.id||null;persist();go('dashboard');toast(t('successImport'));if(active())void activateData(active());}catch{toast(t('invalidImport'));}}});
document.addEventListener('submit',e=>{const form=e.target;if(form.id==='manualForm'){e.preventDefault();const raw=form.elements.id.value.trim(),name=form.elements.name.value.trim(),source=form.elements.provider.value;if(!/^[a-z0-9-]{2,65}$/i.test(raw))return toast(t('notFound'));if(source==='sensemap'&&!/^[a-f0-9]{24}$/i.test(raw.replace(/^sm:/,'')))return toast('openSenseMap ID: 24 hexadecimal characters');closeModal();addStation({id:source==='sensemap'?'sm:'+raw.replace(/^sm:/,''):raw.toUpperCase(),name:name||raw,source});}if(form.id==='renameForm'){e.preventDefault();const st=store.stations.find(s=>s.id===form.dataset.id);if(st){st.alias=form.elements.label.value.trim().slice(0,90);persist();closeModal();render();}}if(form.id==='placeForm'){e.preventDefault();const text=form.elements.place.value.trim();if(!text)return;const status=$('#mapStatus');if(status)status.textContent=t('loading')+'…';void placeSearch(text).then(loc=>{if(rt.map){rt.map.setView([loc.lat,loc.lon],11);return;}return findAt(loc.lat,loc.lon,false);}).catch(err=>{if($('#mapStatus'))$('#mapStatus').textContent=err.message;});}});
$('#modal').addEventListener('close',()=>{if(rt.map){rt.map.remove();rt.map=null;}});$('#sheet').addEventListener('close',()=>{if(rt.sheet)closeSheet();});
let sheetStart=null;$('#sheet').addEventListener('touchstart',e=>{const node=e.target.closest('.sheet-head');sheetStart=node?{y:e.touches[0].clientY,x:e.touches[0].clientX}:null;},{passive:true});$('#sheet').addEventListener('touchend',e=>{if(!sheetStart)return;const delta=e.changedTouches[0].clientY-sheetStart.y,x=e.changedTouches[0].clientX-sheetStart.x;if(delta>105&&Math.abs(delta)>Math.abs(x)*1.5)closeSheet();sheetStart=null;},{passive:true});
let stationSwipe=null;$('#app').addEventListener('touchstart',e=>{if(rt.screen!=='dashboard'||rt.edit||$('#sheet').open||$('#modal').open)return;stationSwipe={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('#app').addEventListener('touchend',e=>{if(!stationSwipe)return;const dx=e.changedTouches[0].clientX-stationSwipe.x,dy=e.changedTouches[0].clientY-stationSwipe.y;stationSwipe=null;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.6)switchStation(dx<0?1:-1);},{passive:true});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();rt.installEvent=e;});
window.addEventListener('online',()=>{if(active()&&!document.hidden)void activateData(active());});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active())void activateData(active());});
function scheduleRefresh(){setTimeout(()=>{if(!document.hidden&&active()&&rt.screen==='dashboard')void loadCurrent(active());scheduleRefresh();},Math.max(60,Number(store.settings.refresh)||60)*1000);}scheduleRefresh();
// Inline manifest and minimal offline shell SW. A file:// launch cannot register an SW.
// The linked manifest.webmanifest provides stable install metadata and PNG icons.
// Service Worker registration needs a real same-origin JavaScript URL. See optional sw.js.
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();if(active())void activateData(active());else setTimeout(()=>{if(!active()&&!$('#modal').open)mapDialog();},260);
})();
