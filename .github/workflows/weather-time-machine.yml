name: Weather Time Machine tests
on:
  push:
    paths:
      - 'weather-time-machine/**'
      - '.github/workflows/weather-time-machine.yml'
  pull_request:
    paths:
      - 'weather-time-machine/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test weather-time-machine/*.test.mjs
