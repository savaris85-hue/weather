name: StationView Athens API smoke
on:
  push:
    branches: [stationview-validate-422]
  workflow_dispatch:
jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare provider validation and Athens station list
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json
          base="https://api.opensensemap.org/boxes"
          for label,p in [
            ("Athens bbox correct",{"bbox":"23.68,37.93,23.80,38.04","limit":"20","format":"json"}),
            ("Athens near correct",{"near":"23.72,37.97","maxDistance":"15000","limit":"20","format":"json"}),
            ("Invalid limit reproducer",{"bbox":"23.68,37.93,23.80,38.04","limit":"100","format":"json"})]:
            url=base+"?"+urllib.parse.urlencode(p)
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"StationView-API-Smoke/1.0","Accept":"application/json"}),timeout=30) as r:
                payload=json.load(r)
                print(label,"STATUS",r.status,"items",len(payload) if isinstance(payload,list) else "non-list",flush=True)
                for item in (payload[:5] if isinstance(payload,list) else []):
                  print("  BOX", item.get("name"),item.get("_id"),item.get("lastMeasurementAt"),[(x.get("title"),x.get("lastMeasurement",{}).get("value")) for x in item.get("sensors",[])[:12]],flush=True)
                print("  CORS",r.headers.get("Access-Control-Allow-Origin"),flush=True)
            except urllib.error.HTTPError as e:
              print(label,"STATUS",e.code,"body",e.read(500).decode("utf8","replace"),flush=True)
            except Exception as e:
              print(label,type(e).__name__,str(e),flush=True)
          PY

  browser-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Open published map and select real station
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1240,height:900}});
          const errors=[],requests=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('response',r=>{if(r.url().includes('opensensemap.org/boxes?'))requests.push({status:r.status(),url:r.url()});});
          try{
            const response=await page.goto('https://savaris85-hue.github.io/weather/stationview/?ci=20261123-422',{waitUntil:'domcontentloaded',timeout:55000});
            console.log('LIVE HTTP',response.status());
            await page.locator('#modal[open]').waitFor({timeout:15000});
            await page.waitForTimeout(25000);
            console.log('MAP STATUS',await page.locator('#mapStatus').textContent());
            console.log('STATION BUTTONS',await page.locator('.nearby-item').count());
            console.log('API RESPONSES',JSON.stringify(requests.slice(-20)));
            console.log('JS ERRORS',JSON.stringify(errors));
            const link=await page.locator('#officialPwsMap').getAttribute('href');
            console.log('FULL NETWORK LINK',link);
            if(!link.includes('lat='))throw Error('Missing official map coordinate link');
            if(requests.some(r=>r.status===422))throw Error('422 from live API');
            if(!requests.some(r=>r.status===200))throw Error('No successful real station API request');
            if(await page.locator('.nearby-item').count()){
              await page.locator('.nearby-item').first().click();
              await page.waitForTimeout(1500);
              console.log('STATION DASHBOARD',await page.locator('.hero h1').allTextContents());
            }else{console.log('No community stations reported in these bounds');}
            if(errors.length)throw Error('JavaScript errors in browser');
          }finally{await browser.close();}
          JS

# Live published center-first and Greeklish search validation
